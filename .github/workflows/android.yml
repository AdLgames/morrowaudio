name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test private AI backend without provider credentials
        run: node --test ai-backend/test/*.test.mjs
      - name: Check desktop app sources
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test src/core.test.mjs
          node build.mjs
      - name: Test, lint, and build
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
          ./gradlew --stop
      - name: Enable Android emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test playback, torrent transfers and storage on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Pin the archived stable binary: 37.2.12 repeatedly lost the emulator during playback.
          emulator-build: 13610412
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu off -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          script: bash scripts/check-android-device.sh
      - name: Capture emulator host diagnostics on failure
        if: failure()
        run: |
          mkdir -p app/build/reports/device-screenshots
          free -m > app/build/reports/device-screenshots/host-memory.txt
          sudo dmesg | tail -100 >> app/build/reports/device-screenshots/host-memory.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Narrumo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            app/build/reports/device-screenshots/
            app/build/reports/onboarding-device/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
